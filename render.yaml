# Render blueprint: ONE free web service that runs the API and also serves the website, so everything is on a single
# address (cookies stay first-party and login works on every browser). Uploaded PDFs and covers are stored inside
# MongoDB Atlas (STORAGE_DRIVER=gridfs), so nothing depends on this host's disk, which is wiped on every restart.
#
# Render dashboard: New > Blueprint > pick this repository. Values marked `sync: false` are asked for once during
# setup and are never stored in git.
services:
  - type: web
    name: rankora
    runtime: node
    plan: free
    # Install everything (the website build needs dev tools), build the website, then install the API's own packages.
    buildCommand: npm ci --include=dev && npm run build && npm ci --prefix server
    startCommand: node server/src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SERVE_FRONTEND
        value: "true"
      - key: STORAGE_DRIVER
        value: gridfs
      # Scratch space for per-student watermarked copies (a disposable cache that is rebuilt on demand).
      - key: PRIVATE_STORAGE_DIR
        value: /tmp/jeedge
      # Free instances have 512 MB of memory; large PDFs are processed in memory, so keep uploads modest.
      - key: MAX_PDF_MB
        value: 25
      - key: COOKIE_SAMESITE
        value: lax
      - key: JWT_SECRET
        generateValue: true
      # Your MongoDB Atlas connection string: mongodb+srv://USER:PASSWORD@cluster.xxxxx.mongodb.net/rankora
      - key: MONGODB_URI
        sync: false
      # The address visitors use: https://www.jeedge.in (add jeedge.in and www.jeedge.in under Custom Domains first).
      - key: FRONTEND_ORIGIN
        sync: false
      # Payments stay closed until Razorpay is set up. To open them: add the three RAZORPAY_* values in the
      # dashboard, then delete this variable (or set it to razorpay).
      - key: PAYMENT_PROVIDER
        value: disabled
      - key: SUPPORT_EMAIL
        sync: false
